[package]
name = "rawvault-common"
description = "Pure domain logic shared by RawVault backend Lambdas: formats, keys, assets, timeline."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
keywords = ["photos", "raw", "timeline"]
categories = ["multimedia::images"]

[features]
# Derives TypeScript bindings for the API types (run `cargo test --features ts`).
ts = ["dep:ts-rs"]

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json = "1"
hmac.workspace = true
sha2.workspace = true
ts-rs = { workspace = true, optional = true }

[lints]
workspace = true
