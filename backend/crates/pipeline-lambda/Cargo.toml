[package]
name = "lawt-pipeline-lambda"
description = "AWS Lambda that plans, renders and publishes the timeline. Invoked manually by the owner."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pipeline"
path = "src/main.rs"

[dependencies]
lawt-common = { path = "../common" }
lawt-pipeline = { path = "../pipeline" }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
chrono = { workspace = true }
lambda_runtime = "0.13"
serde = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
